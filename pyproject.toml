[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scanip"
version = "1.1.1"
description = "Netzwerk-Scanner fuer Windows, macOS und Linux: IP, offene Ports, MAC, Geraetekategorie und Geraetename"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]

[project.scripts]
scanip = "scanip.cli:main"

[project.gui-scripts]
scanip-gui = "scanip.gui:run_gui"

[tool.setuptools]
packages = ["scanip"]
